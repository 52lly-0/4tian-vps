name: AclClouds-卡卡自动续期

on:
  schedule:
    # 每天 UTC 01:00（北京时间 09:00）
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装系统依赖 (xvfb 供浏览器 GUI 操作 + 中文字体)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk
          pip install -r requirements.txt
          seleniumbase install chromedriver || true

      - name: 🛠 安装并启动 sing-box 代理 (供浏览器过 Turnstile)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "ℹ️ 未配置 NODE_LINK Secret，浏览器将直连访问。"
            echo "LOCAL_PROXY=" >> "$GITHUB_ENV"
            echo "IS_PROXY=false" >> "$GITHUB_ENV"
          else
            echo "📥 获取 sing-box 最新版本..."
            API_RESP=$(curl -sf -H "Authorization: token ${GH_TOKEN}" \
              https://api.github.com/repos/SagerNet/sing-box/releases/latest)
            if [ -z "$API_RESP" ]; then
              echo "⚠️ 带 token 的 API 请求失败，尝试无 token 请求..."
              API_RESP=$(curl -sf https://api.github.com/repos/SagerNet/sing-box/releases/latest)
            fi
            if [ -z "$API_RESP" ]; then
              echo "❌ GitHub API 请求失败（可能被限流）"
              exit 1
            fi
            SINGBOX_VER=$(echo "$API_RESP" | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"v\{0,1\}\([^"]*\)".*/\1/p')

            TARBALL="sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
            DL_URL="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/${TARBALL}"
            curl -fLo sing-box.tar.gz "$DL_URL"
            tar -xzf sing-box.tar.gz
            cp "sing-box-${SINGBOX_VER}-linux-amd64/sing-box" ./sing-box
            chmod +x ./sing-box

            echo "📝 转换节点链接为 sing-box 配置..."
            python3 convert.py "$NODE_LINK"

            echo "🚀 启动 sing-box..."
            # convert.py 生成的 inbound 为 HTTP 类型，监听 127.0.0.1:8080
            nohup ./sing-box run -c config.json > sing-box.log 2>&1 &
            SINGBOX_PID=$!
            sleep 3

            echo "⏳ 正在预热隧道并验证连通性 (带重试机制)..."
            PROXY_OK=false
            for i in {1..6}; do
              # sing-box 暴露的是 HTTP 代理，必须使用 http:// 前缀
              if curl -x http://127.0.0.1:8080 -s --max-time 5 https://api.ip.sb/ip; then
                PROXY_OK=true
                break
              fi
              echo "⏳ 隧道握手中，等待 3 秒后重试 ($i/6)..."
              sleep 3
            done

            if [ "$PROXY_OK" = true ]; then
              echo ""
              echo "✅ sing-box 代理全速贯通！(PID: $SINGBOX_PID)"
              echo "LOCAL_PROXY=http://127.0.0.1:8080" >> "$GITHUB_ENV"
              echo "IS_PROXY=true" >> "$GITHUB_ENV"
            else
              echo ""
              echo "❌ 代理连通性测试彻底失败，节点可能已离线！"
              if [ -f "sing-box.log" ]; then
                echo "📄 附: sing-box 运行崩溃日志："
                cat sing-box.log
              else
                echo "⚠️ 未在当前目录找到 sing-box.log"
              fi
              kill $SINGBOX_PID || true
              exit 1
            fi
          fi

      - name: 执行续期
        env:
          ACL_COOKIES: ${{ secrets.ACL_COOKIES }}
          ACL_ACCOUNTS: ${{ secrets.ACL_ACCOUNTS }}
          ACL_EMAIL: ${{ secrets.ACL_EMAIL }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.LOCAL_PROXY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        # xvfb-run 提供虚拟显示器, uc_gui_click_captcha 的 GUI 点击才能工作
        # 当配置了 NODE_LINK 时, PROXY_SERVER 指向 sing-box 的 HTTP 代理 (127.0.0.1:8080)
        run: xvfb-run --auto-servernum python renew_fixed.py

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box.tar.gz config.json sing-box.log
